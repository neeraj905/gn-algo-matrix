name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Swap Space (Prevent Out-Of-Memory Crash)
        run: |
          sudo swapoff -a
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache git python3-pip libltdl-dev
          python -m pip install --upgrade pip
          pip install "buildozer<2.0.0" "cython==0.29.36"

      - name: Build APK with Buildozer
        run: |
          HOME=/tmp buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GN-Algo-Matrix-APK
          path: bin/*.apk
          
